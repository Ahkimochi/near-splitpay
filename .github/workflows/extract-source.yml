name: Extract source archive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: |
          unzip -o near-splitpay-upload.zip
          git rm --quiet near-splitpay-upload.zip
          git rm -r --quiet --cached .github
          rm -rf .github
          find . -type f -not -path './.git/*' | sort
      - name: Commit migration
        run: |
          git config user.name "Ahkimochi"
          git config user.email "ahkimochi@users.noreply.github.com"
          git add -A
          git commit -m "Migrate wallet layer to NEAR Connect (@hot-labs/near-connect) — MyNearWallet sunset" || echo "nothing to commit"
          git log --oneline -5
          git status --short
          git push

name: Extract source archive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: |
          unzip -o near-splitpay-upload.zip
          git rm --quiet near-splitpay-upload.zip
          git rm -r --quiet --cached .github
          rm -rf .github
          find . -type f -not -path './.git/*' | sort
      - name: Commit files folder by folder
        run: |
          git config user.name "Ahkimochi"
          git config user.email "ahkimochi@users.noreply.github.com"
          git add .gitignore LICENSE README.md SUBMISSION.md index.html package-lock.json package.json tsconfig.json vite.config.ts
          git commit -m "Add root files" || echo "no root changes"
          git add public
          git commit -m "Add public" || echo "no public changes"
          git add scripts
          git commit -m "Add scripts" || echo "no scripts changes"
          git add src/*.ts src/*.css
          git commit -m "Add src" || echo "no src changes"
          git add src/views
          git commit -m "Add src/views" || echo "no views changes"
          git log --oneline -8
          git status --short
          git push
